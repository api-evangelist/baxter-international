description: >-
  Baxter operates no trust center in the SaaS sense - there is no trust.baxter.com, no
  self-serve compliance-document portal, and no SOC 2 or ISO 27001 report offered under NDA.
  What it publishes instead is the medical-device equivalent: a product security programme page
  carrying a coordinated disclosure policy, a 25-bulletin advisory archive, a statement that
  MDS2 security-disclosure forms are provided for its devices, and a named set of industry
  bodies it participates in. This artifact records that hub as it actually exists rather than
  forcing it into a SaaS trust-center shape.
