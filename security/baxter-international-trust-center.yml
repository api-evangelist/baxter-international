      maintenance of fielded devices across the product lifecycle.
  - name: Secure by Design
    description: Lifecycle security programme spanning Quality, Regulatory, R&D, Privacy and
      Product Security, stated to be informed by FDA, NIST and ISO and guided by HIPAA and GDPR.
  - name: Transparent Product Security Communications
    description: MDS2 statements in the NEMA/HIMSS industry standard format covering audit
      controls, user identification and authorization, data backup and disaster recovery,
      malware detection/protection, system and application hardening, and transmission
      confidentiality and integrity.
  - name: Strong Industry Partnerships
    description: Named participation in NH-ISAC, ICS-CERT, AdvaMed, AAMI, HSIN, MDISS, MDSISC
      and MDIC.
