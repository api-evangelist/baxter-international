description: >-
  Every named /.well-known path was probed on every host this record knows: the registrable
  domain and www, the API entry's humanURL host, the support/docs hosts, and the hosts of the
  brands Baxter acquired (Hillrom 2021, Welch Allyn via Hillrom 2015). Nothing was found.
  Two failure shapes matter here and are recorded separately: www.baxter.com, pro.baxter.com
  and infusiontechnology.baxter.ca are Drupal sites that answer HTTP 200 with an HTML page
  titled "The requested page was not found on our website" for any unknown path - a soft-404,
  scored as a MISS, not a document. api.hillrom.com and developer.hillrom.com answer HTTP 403
  with a generic "TURN AROUND!" page on EVERY path including "/", which is a blanket edge
  block and is therefore no evidence that a surface exists behind it.
  No pointer of type WellKnown or SecurityTxt is emitted: nothing returned a real document.
