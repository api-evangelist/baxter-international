apis:
  - aid: baxter-international:device-bridge
    name: Baxter DeviceBridge Platform
    description: >-
      Baxter's DeviceBridge is a cloud-based platform that enables secure data transfer
      from Baxter medical devices to hospital IT systems including electronic medical
      records (EMRs). It supports clinical data interoperability across Baxter's connected
      device ecosystem including infusion pumps, vital signs monitors, and other patient
      care devices.
    humanURL: https://www.baxter.com/what-we-do/connected-care
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/baxter-international.png
    tags:
      - Healthcare
      - Connected Devices
      - Interoperability
      - EMR Integration
    properties:
      - type: Documentation
        url: https://support.baxter.com/en/resources/it-resources/emr-connectivity/
      - type: Documentation
        url: https://infusiontechnology.baxter.ca/integrated-clinical-software-solutions
      - type: SDKs
        url: https://www.hillrom.com/content/dam/hillrom-aem/us/en/sap-documents/LIT/80019/80019598LITPDF.pdf
      - type: Integrations
        url: https://support.baxter.com/en/resources/it-resources/emr-partners/
      - type: SignUp
        url: https://support.baxter.com/en/contact-us/
    x-access: >-
      OEM / EMR-partner licensing. Baxter's EMR Connectivity page states verbatim: "For
      information on Software Development Kits (SDK), CARDIOPERFECT API as an Original Equipment
      Manufacturer (OEM), interface development partnerships, or licensing and marketing, please
      contact us." There is no self-serve signup, API key, sandbox or published base URL.
    x-base-url-finding: >-
      repair-api-bases.py returned verdict "missing" on 2026-09-04. The docs pass confirmed the
      verdict: no Baxter page names an API host. baseURL is deliberately left unset rather than
      guessed from the domain.
    x-pointer-repair: >-
      The previous humanURL and Documentation pointer,
      https://www.baxter.com/perspectives/healthcare-insights/turn-insights-action-connected-medical-devices,
      is a soft-404 - it returns HTTP 200 with a page titled "The requested page was not found on
      our website". It was the sole source for the DeviceBridge platform claim and for the HL7
      FHIR claim in this record, and both have been requalified accordingly (see
      conformance/baxter-international-conformance.yml). Removed 2026-09-04.

