name: Baxter International
description: >-
  Baxter International (NYSE: BAX) is a global medical products company that develops,
  manufactures and markets infusion systems and pumps, IV fluids and injectable medicines,
  patient monitoring and diagnostic devices, hospital beds and patient mobility products,
  surgical equipment and care-communications systems. Its connected-care portfolio moves
  medical device data into hospital IT systems and electronic medical records; Baxter reports
  well over 600 device interfaces and integrations with more than 150 EMR companies. Baxter
  acquired Hillrom in December 2021, which had acquired Welch Allyn in 2015, so the Welch Allyn
  Connectivity SDK and the CARDIOPERFECT API are now Baxter integration surfaces. Those
  surfaces are licensed to OEMs and EMR partners under agreement rather than published: as of
  2026-09-04 no OpenAPI, AsyncAPI, GraphQL schema, WSDL, MCP server or agent card is served on
  any Baxter, Hillrom or Welch Allyn host.
