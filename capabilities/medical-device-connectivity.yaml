capability:
  name: Baxter DeviceBridge Medical Device Connectivity
  description: >-
    Baxter's DeviceBridge platform capabilities for connecting medical devices
    to hospital IT systems, EMRs, and clinical data repositories using
    HL7 FHIR and proprietary connectivity standards.
  categories:
    - name: Device Data Transfer
      description: Secure transfer of clinical data from Baxter medical devices to hospital systems.
      operations:
        - name: Get Device Data
          description: Retrieve latest clinical readings from a connected Baxter device.
        - name: Stream Device Observations
          description: Subscribe to real-time data stream from a medical device.
        - name: Get Device Status
          description: Retrieve operational status and alarm state of a connected device.
    - name: Infusion Pump Integration
      description: Infusion therapy data integration for smart pump documentation.
      operations:
        - name: Get Infusion Record
          description: Retrieve completed infusion record for EMR documentation.
        - name: Submit BCMA Verification
          description: Submit barcode medication administration verification data.
        - name: Get Drug Library
          description: Retrieve the current drug library configuration for a pump.
        - name: Update Drug Library
          description: Push updated drug library to connected infusion pumps.
    - name: EMR Integration
      description: Electronic medical record integration for automated clinical documentation.
      operations:
        - name: Post Observation to EMR
          description: Automatically post device reading as an observation to the EMR via FHIR.
        - name: Get Patient ADT
          description: Retrieve patient admission, discharge, transfer events from EMR.
    - name: Patient Monitoring
      description: Vital signs and patient monitoring device integration.
      operations:
        - name: Get Vital Signs
          description: Retrieve vital signs data (HR, SpO2, BP, RR, temperature) from bedside monitor.
        - name: Get Alarm History
          description: Retrieve alarm and alert history for a connected monitoring device.
