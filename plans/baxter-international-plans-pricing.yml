description: >-
  Baxter publishes NO plans and NO pricing for any developer or integration offering. Its only
  developer-facing page routes every request for the Connectivity SDK or the CARDIOPERFECT API to
  a contact form for OEM licensing, partnership or marketing discussions. There is no tier list,
  no price, no quota, no free tier and no self-serve signup anywhere on Baxter's surface.
  plan_count is 0 because that is the measurement, not because the file is unfinished.
notes: >-
  SUPERSEDES a 2026-05-04 bulk-sweep artifact (method: generated) that described a
  "DeviceBridge Hospital Engagement" plan with entries priced "contact Baxter Connected Care" and
  "contact sales". Those tiers were not published by Baxter anywhere - they were a plausible shape
  written on the provider's behalf. They have been removed. What Baxter actually publishes is the
  absence of pricing, and that is now what this file records.
