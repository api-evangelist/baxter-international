specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Baxter International
providerId: baxter-international
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Healthcare
  - Medical Devices
  - Connected Health
  - Rate Limiting
description: Baxter does not publish public rate limits for its DeviceBridge platform. Capacity is provisioned
  per hospital deployment and tuned to the connected-device fleet size. Numeric values are not asserted
  here.
notes: Reconcile with the hospital's DeviceBridge integration runbook or Baxter Connected Care implementation
  team once available. Do not invent throughput numbers.
sources:
  - https://www.baxter.com/perspectives/healthcare-insights/turn-insights-action-connected-medical-devices
responseCodes:
  throttled: 429
limits:
  - name: Per-tenant ingestion rate
    scope: hospital-tenant
    metric: varies
    limit: 'sized to connected-device fleet; see DeviceBridge integration runbook'
    notes: DeviceBridge ingests telemetry from infusion pumps and monitors; capacity is provisioned per
      hospital deployment.
  - name: HL7 FHIR API throttle
    scope: integration
    metric: varies
    limit: 'see integration runbook'
    notes: FHIR endpoint capacity is governed by the EMR-side connector and DeviceBridge configuration.
policies:
  - name: Backoff Strategy
    description: Use exponential backoff with jitter on throttled responses. Honor Retry-After when present.
  - name: Per-Hospital Provisioning
    description: Capacity is tuned at deployment to the device fleet and EMR throughput, not enforced
      via a public per-second number.
  - name: Clinical Safety Constraints
    description: Connected-device APIs operate inside a regulated clinical environment; integration changes
      and load profiles must follow the hospital's biomed/IT change-control process.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
