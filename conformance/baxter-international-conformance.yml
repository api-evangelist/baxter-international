description: >-
  Standards and compliance posture assembled from Baxter's own live pages. IMPORTANT CAVEAT ON
  EVIDENCE CLASS: Baxter publishes no machine-readable contract (no OpenAPI, AsyncAPI, GraphQL,
  WSDL or OGC document was found on any host - see well-known/ and mcp/ in this repo). Every
  entry below is therefore evidenced by a PUBLISHED PROGRAM STATEMENT on a first-party page,
  not by a signature read out of a contract. Nothing here was inferred from a spec, because
  there is no spec. Entries the search could not substantiate are recorded conforms:false
  rather than omitted, so the absences are visible.
conformance:
  - id: mds2
    name: Manufacturer Disclosure Statement for Medical Device Security (NEMA/HIMSS)
    conforms: true
    evidence: https://www.baxter.com/about-baxter/governance/product-security
    evidence_class: published-program-statement
    quote: >-
      "We provide a Manufacturer Disclosure Statement for Medical Device Security (MDS2) in the
      industry standard format established by the National Electrical Manufacturers Association
      and the Healthcare Information and Management System Society"
    note: >-
      The domain standard for this market. MDS2 is the medical-device sector's structured
      security-disclosure form - the artefact a hospital's biomed/IT team reads before putting a
      device on the network. A vendor that ships MDS2 needs no bespoke security questionnaire;
      one that does not, does. Baxter states it provides MDS2 for its products, but the
      statements themselves are distributed through Baxter representatives rather than published
      at a URL, so this is a stated conformance, not a fetched document.
