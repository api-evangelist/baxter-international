tags:
  - Healthcare
  - Medical Devices
  - Connected Health
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps shape for Baxter DeviceBridge: bundled hospital services agreement
  rather than per-API-call billing. Cost is tied to the connected-device fleet (infusion pumps, monitors)
  and integration scope rather than to API request volume.'
notes: No public rate card. Replace meter values with the customer's negotiated DeviceBridge scope and
  per-device economics once available.
sources:
  - https://www.baxter.com/perspectives/healthcare-insights/turn-insights-action-connected-medical-devices
principles:
  - name: Visibility
    description: Track connected-device count, EMR integration scope, and integration uptime via the
      hospital's biomed and IT operations dashboards.
  - name: Allocation
    description: Allocate platform cost across hospital units (ICU, oncology, peri-op) by connected-device
      count and infusion-volume per unit.
  - name: Optimization
    description: Right-size connected-device scope each renewal — only instrument devices where EMR auto-documentation
      saves nursing time or improves medication-safety metrics.
  - name: Accountability
    description: Assign biomed/IT joint ownership of the DeviceBridge engagement; review uptime, integration
      changes, and renewal scope quarterly.
billingModel:
  pricingCategory: Hospital Services Agreement
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Baxter DeviceBridge
  ServiceCategory: Healthcare / Medical Device Connectivity
  ProviderName: Baxter International
  PublisherName: Baxter Healthcare Corporation
  InvoiceIssuerName: Baxter Healthcare Corporation
  PricingCategory: Hospital Services Agreement
  PricingUnit: device
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: connected_devices
    description: Connected Baxter medical devices integrated through DeviceBridge
    unit: device
    aggregation: max
    dimensions:
      - device_class
      - hospital_unit
  - name: emr_integrations
    description: EMR / hospital IT integration endpoints in scope
    unit: integration
    aggregation: count
    dimensions:
      - emr_vendor
  - name: device_telemetry
    description: Telemetry events ingested from connected devices (operational meter, not necessarily
      billed per event)
    unit: event
    aggregation: sum
    dimensions:
      - device_class
      - hospital_unit
apis:
  - name: Baxter DeviceBridge Platform
    baseURL: ''
    tags:
      - Healthcare
      - Connected Devices
      - Interoperability
      - EMR Integration
    serviceName: Baxter DeviceBridge Platform
    serviceCategory: API
unitEconomics:
  - name: Cost per Connected Device
    metric: platform_cost / connected_devices
    target: align to per-device clinical / documentation savings
